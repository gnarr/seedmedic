<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Replaced at request time with `server.base_path`, so one bundle serves
         every deployment including one behind a reverse-proxy prefix. -->
    <base href="__SEEDMEDIC_BASE__" />
    <title>SeedMedic</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Relative, so it resolves against <base> under a reverse-proxy prefix. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Hit-and-run repair for private trackers." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
