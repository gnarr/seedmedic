# SeedMedic configuration.
#
# Copy to config.toml and edit. Point SEEDMEDIC_CONFIG at it to use another path.
#
# Every secret below (tracker api_key, download_client password) can also come
# from a file or the environment, so a real deployment need not keep secrets in
# this file at all. Precedence, highest first:
#
#   1. SEEDMEDIC_TRACKER_<ID>_API_KEY / SEEDMEDIC_ARR_<NAME>_API_KEY /
#      SEEDMEDIC_DOWNLOAD_CLIENT_PASSWORD
#      (the tracker id or *arr name, uppercased, non-alphanumeric -> `_`)
#   2. api_key_file / password_file — a path to a file holding the secret,
#      e.g. a mounted Docker/Kubernetes secret. Trailing newlines are trimmed,
#      so `echo "key" > /run/secrets/x` works as expected.
#   3. api_key / password inline below.
#
# As shipped this runs the built-in fake tracker and download client, so you can
# watch the whole workflow without touching anything real. Two demo hit-and-runs
# are discovered on startup; with an empty library they park for review with
# "no library file matches", which is the correct outcome.
#
# To watch one repair all the way through, give it something to find:
#
#   mkdir -p /srv/media
#   head -c 1048576 /dev/urandom > /srv/media/movie.mkv
#   head -c 2097152 /dev/urandom > /srv/media/S01E01.mkv
#   head -c 3145728 /dev/urandom > /srv/media/S01E02.mkv
#
# Both repairs then reach `verified` and park on `auto_resume` below. Set that
# to "when_verified_complete", press Retry, and they reach `seeding` — and stop
# there, because the fake tracker never clears its warnings and the tracker is
# the only thing that can say a hit-and-run is over.

[server]
bind_address = "0.0.0.0:9899"

[database]
path = "data/seedmedic.db"

[staging]
# Absolute, and NOT inside a media library root. SeedMedic writes here and
# nowhere else; startup fails if this overlaps [library].roots.
root = "/srv/seedmedic/staging"

# Free space to keep on the staging filesystem beyond what a repair needs.
# A plan that would eat into this margin parks for review rather than
# filling the disk. Default is 1 GiB.
min_free_bytes = 1073741824

[library]
# Read-only. Used as a fallback candidate source and to prove the staging area
# is somewhere else.
roots = ["/srv/media"]

[policy]
# "never" (default) or "when_verified_complete". There is no "always": nothing
# resumes without a clean hash check.
auto_resume = "never"

# "ambiguous", "probable" (default) or "exact". "exact" only comes from a
# candidate whose bytes were hashed against the torrent's pieces and matched.
min_match_confidence = "probable"

# Pieces hashed per file to confirm a match: first, last, and roughly middle,
# bounded rather than the whole file. 0 disables verification, so a match can
# never exceed "probable".
verification_pieces = 3

# Copy-on-write clone: free, and writes to the staged file never reach the
# library. Preferred. Not implemented yet (docs/todos/0006), so it currently
# falls through to the next permitted strategy.
prefer_reflink = true

# A hardlinked staged file IS the library file. Enabling this means a partially
# complete torrent could let the client write into your media — SeedMedic
# refuses to resume in that situation, but the safest setting is off.
allow_hardlink = false

# Full copy: costs disk, shares nothing.
allow_copy = true

max_attempts = 5
retry_base_seconds = 30
retry_max_seconds = 3600

# How often to poll a running recheck, at first. Doubles as the check keeps
# running, capped at recheck_poll_max_seconds — a 40-minute check on a large
# torrent does not need a request every 15 seconds throughout.
recheck_poll_seconds = 15
recheck_poll_max_seconds = 300

# A recheck running longer than this parks the job for review instead of
# polling forever. Four hours is generous for a 100 GB torrent on spinning
# rust; raise it for slower storage.
recheck_timeout_seconds = 14400

tracker_poll_seconds = 900

[worker]
owner = "seedmedic"
lease_seconds = 300
batch_size = 4
poll_interval_seconds = 10
discovery_interval_seconds = 900

# One block per tracker. `id` is the key repair jobs are filed under; changing
# it orphans existing jobs.
[[trackers]]
id = "demo"
# "unit3d" for Blutopia/Aither and relatives, or "fake" for the built-in demo
# tracker.
kind = "fake"
base_url = "http://localhost"
api_key = ""
# api_key_file = "/run/secrets/aither_api_key"
# Where the Unit3D API key goes: "header" (default, `Authorization: Bearer`)
# or "query" (`?api_token=`), for instances that require it in the URL.
token_placement = "header"

[download_client]
# "qbittorrent" or "fake".
kind = "fake"
base_url = "http://localhost:8080"
username = ""
password = ""
# password_file = "/run/secrets/qbittorrent_password"
category = "seedmedic"

# Optional Sonarr/Radarr instances for candidate discovery. Read-only: parses
# a release name into the series/movie it belongs to, then asks Sonarr/Radarr
# which files it already imported for it. Falls back to the filesystem scan
# of [library].roots when unset, down, or it does not recognise a release.
# [[arr]]
# kind = "sonarr"
# name = "main"
# base_url = "http://sonarr:8989"
# api_key = "replace-me"
# api_key_file = "/run/secrets/sonarr_api_key"
#
# Only needed if Sonarr/Radarr runs in a container that sees your library at
# a different path than SeedMedic does.
# [[arr.path_mappings]]
# from = "/tv"
# to = "/srv/media/tv"
