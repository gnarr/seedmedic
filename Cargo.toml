[package]
name = "seedmedic"
version = "0.1.0"
edition = "2024"
# The toolchain CI and the Dockerfile both use — see RUST_VERSION in
# .github/workflows/ci.yml and ARG RUST_VERSION in the Dockerfile. There is no
# MSRV job, so claiming a lower minimum than the only version ever compiled
# would be a claim nothing checks.
rust-version = "1.96"
description = "Detects hit-and-run warnings on private trackers and repairs them from the local media library"
license = "MIT"

[features]
default = ["fakes"]
# Behaviourally meaningful in-memory adapters. They exist so the repair workflow
# can be exercised end to end before the real adapters land, and they are
# selectable from config via `kind = "fake"`. Remove from `default` once the
# Unit3D (docs/todos/0002) and qBittorrent (docs/todos/0007) adapters are real.
fakes = []
# In-process counters at /metrics, gated further by `metrics.enabled` in
# config — see docs/todos/0012-observability.md. Off the default feature set:
# most self-hosted users never scrape this, and it must add nothing to a
# build that does not ask for it.
metrics = []

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# The built operator UI, embedded in the binary.
#
# Embedded rather than served from disk so the runtime image keeps COPYing
# exactly three files and `cargo run` from a checkout needs no asset path —
# serving from disk would need `tower-http`'s ServeDir, a fourth COPY, and a
# path-traversal surface. The directory always exists (a tracked
# `web/dist/.gitkeep`), so this compiles for somebody who only has cargo; an
# absent bundle is a 503 that says how to build it, not a broken build.
include_dir = "0.7"
libc = "0.2"
maud = { version = "0.27", features = ["axum"] }
reflink-copy = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sqlx = { version = "0.9", features = ["chrono", "runtime-tokio", "sqlite"] }
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# `BroadcastStream`, to turn the event bus's `broadcast::Receiver` into the
# `Stream` axum's `Sse` takes. Not just a shim: its `Lagged` error is the
# backpressure signal the SSE handler turns into a `gap` event, which is how a
# client that fell behind learns to refetch instead of quietly missing
# transitions. Already in Cargo.lock as a transitive dependency.
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.1"
toml_edit = "0.25.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
sha1 = "0.10"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
strip = true
